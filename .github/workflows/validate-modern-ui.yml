name: Validar OpenLadder Studio

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Compilar OpenLadder Studio e ferramentas
        shell: cmd
        working-directory: PC12_v2.1_Windows7_v3_portatil
        run: |
          call BUILD_INTERFACE_MODERNA.bat
          if errorlevel 1 exit /b 1
          if not exist OpenLadderStudio.exe exit /b 1
          if not exist OpenLadderEditor.exe exit /b 1
          if not exist OpenLadderDeviceManager.exe exit /b 1
          if not exist OpenLadderModbus.exe exit /b 1
          if not exist OpenLadderMemoryMap.exe exit /b 1
          if not exist OpenLadderUpdater.exe exit /b 1

      - name: Instalar Inno Setup 6 se necessário
        shell: powershell
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe não encontrado.' }

      - name: Gerar instalador
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\PC12Studio.iss"

      - name: Gerar SHA-256
        shell: powershell
        run: |
          $setup = 'installer\output\OpenLadder-Studio-Setup.exe'
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OpenLadder-Studio-Setup.exe" | Set-Content -Encoding ASCII 'installer\output\OpenLadder-Studio-Setup.exe.sha256'

      - name: Publicar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: OpenLadder-Studio
          path: |
            PC12_v2.1_Windows7_v3_portatil/OpenLadderStudio.exe
            PC12_v2.1_Windows7_v3_portatil/OpenLadderEditor.exe
            PC12_v2.1_Windows7_v3_portatil/OpenLadderDeviceManager.exe
            PC12_v2.1_Windows7_v3_portatil/OpenLadderModbus.exe
            PC12_v2.1_Windows7_v3_portatil/OpenLadderMemoryMap.exe
            PC12_v2.1_Windows7_v3_portatil/OpenLadderUpdater.exe
            PC12_v2.1_Windows7_v3_portatil/version.txt

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: OpenLadder-Studio-Setup
          path: |
            installer/output/OpenLadder-Studio-Setup.exe
            installer/output/OpenLadder-Studio-Setup.exe.sha256

      - name: Publicar Release para atualização automática
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content 'PC12_v2.1_Windows7_v3_portatil\version.txt').Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'version.txt está vazio.' }
          $tag = "v$version"
          $setup = 'installer\output\OpenLadder-Studio-Setup.exe'
          $sha = 'installer\output\OpenLadder-Studio-Setup.exe.sha256'
          $title = "OpenLadder Studio v$version"
          $notes = "Versão oficial com arquitetura multi-PLC, perfis personalizados Modbus RTU/TCP, monitoramento online periódico, histórico de sinais, gráficos de tendências em tempo real e exportação CSV."

          cmd /c "gh release view $tag --repo $env:GITHUB_REPOSITORY >nul 2>&1"
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $sha --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --title $title --notes $notes --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $tag $setup $sha --target $env:GITHUB_SHA --title $title --notes $notes --repo $env:GITHUB_REPOSITORY
          }
