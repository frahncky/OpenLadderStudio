name: Validar OpenLadder Studio

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar fonte Ladder
        shell: powershell
        working-directory: PC12_v2.1_Windows7_v3_portatil
        run: |
          (Get-Content 'LadderEditor.cs') -replace 'internal sealed class LadderCanvas : Control','internal sealed class LadderCanvas : ScrollableControl' | Set-Content 'LadderEditor.build.cs'

      - name: Compilar atualizador
        shell: cmd
        working-directory: PC12_v2.1_Windows7_v3_portatil
        run: |
          "%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /out:"OpenLadderUpdater.exe" /reference:System.dll /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "PC12Updater.cs"

      - name: Compilar OpenLadder Studio
        shell: cmd
        working-directory: PC12_v2.1_Windows7_v3_portatil
        run: |
          "%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /main:ModernPC12.DirectStudioProgram /out:"OpenLadderStudio.exe" /reference:System.dll /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "PC12DirectStudio.cs" "PC12Studio.cs" "ModernPC12.cs" "LadderEditor.build.cs" "TP02BridgeLab.cs" "TP02ProgramReader.cs" "TP02MachineDecoder.cs" "TP02OpcodeCalibration.cs" "TP02CalibrationCampaign.cs" "TP02AutoDecoder.cs" "TP02IlToLadder.cs" "PC12Updater.cs"

      - name: Instalar Inno Setup 6 se necessário
        shell: powershell
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe não encontrado.' }

      - name: Gerar instalador
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\PC12Studio.iss"

      - name: Gerar SHA-256
        shell: powershell
        run: |
          $setup = 'installer\output\OpenLadder-Studio-Setup.exe'
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OpenLadder-Studio-Setup.exe" | Set-Content -Encoding ASCII 'installer\output\OpenLadder-Studio-Setup.exe.sha256'

      - name: Publicar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: OpenLadder-Studio
          path: |
            PC12_v2.1_Windows7_v3_portatil/OpenLadderStudio.exe
            PC12_v2.1_Windows7_v3_portatil/OpenLadderUpdater.exe
            PC12_v2.1_Windows7_v3_portatil/version.txt

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: OpenLadder-Studio-Setup
          path: |
            installer/output/OpenLadder-Studio-Setup.exe
            installer/output/OpenLadder-Studio-Setup.exe.sha256

      - name: Publicar Release para atualização automática
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content 'PC12_v2.1_Windows7_v3_portatil\version.txt').Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'version.txt está vazio.' }
          $tag = "v$version"
          $setup = 'installer\output\OpenLadder-Studio-Setup.exe'
          $sha = 'installer\output\OpenLadder-Studio-Setup.exe.sha256'
          $title = "OpenLadder Studio v$version"
          $notes = "Versão oficial do OpenLadder Studio. Atualizações podem ser instaladas pela aba ATUALIZAR do próprio software."

          cmd /c "gh release view $tag --repo $env:GITHUB_REPOSITORY >nul 2>&1"
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $sha --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --title $title --notes $notes --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $tag $setup $sha --target $env:GITHUB_SHA --title $title --notes $notes --repo $env:GITHUB_REPOSITORY
          }
