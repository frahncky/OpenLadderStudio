name: Validar OpenLadder Studio

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: openladder-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar metadados e estrutura
        shell: powershell
        run: .\scripts\ValidateProject.ps1

      - name: Compilar OpenLadder Studio e ferramentas
        shell: cmd
        working-directory: PC12_v2.1_Windows7_v3_portatil
        run: |
          call BUILD_INTERFACE_MODERNA.bat
          if errorlevel 1 exit /b 1
          call BUILD_PG_LAB.bat
          if errorlevel 1 exit /b 1
          if not exist OpenLadderStudio.ico exit /b 1
          if not exist OpenLadderStudio.icon.png exit /b 1
          if not exist OpenLadderStudio.exe exit /b 1
          if not exist OpenLadderEditor.exe exit /b 1
          if not exist OpenLadderDeviceManager.exe exit /b 1
          if not exist OpenLadderModbus.exe exit /b 1
          if not exist OpenLadderMemoryMap.exe exit /b 1
          if not exist OpenLadderUpdater.exe exit /b 1
          if not exist OpenLadderTP02PgLab.exe exit /b 1
          if not exist OpenLadderTP02Capture.exe exit /b 1
          if not exist TP02-PG-Tests.json exit /b 1

      - name: Preparar instalador
        shell: powershell
        run: .\scripts\PrepareInstaller.ps1

      - name: Instalar Inno Setup 6 se necessário
        shell: powershell
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe não encontrado.' }

      - name: Gerar instalador
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\PC12Studio.build.iss"

      - name: Gerar SHA-256
        shell: powershell
        run: |
          $setup = 'installer\output\OpenLadder-Studio-Setup.exe'
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OpenLadder-Studio-Setup.exe" | Set-Content -Encoding ASCII 'installer\output\OpenLadder-Studio-Setup.exe.sha256'

      - name: Publicar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: OpenLadder-Studio
          path: |
            PC12_v2.1_Windows7_v3_portatil/OpenLadderStudio.ico
            PC12_v2.1_Windows7_v3_portatil/OpenLadderStudio.icon.png
            PC12_v2.1_Windows7_v3_portatil/OpenLadderStudio.exe
            PC12_v2.1_Windows7_v3_portatil/OpenLadderEditor.exe
            PC12_v2.1_Windows7_v3_portatil/OpenLadderDeviceManager.exe
            PC12_v2.1_Windows7_v3_portatil/OpenLadderModbus.exe
            PC12_v2.1_Windows7_v3_portatil/OpenLadderMemoryMap.exe
            PC12_v2.1_Windows7_v3_portatil/OpenLadderUpdater.exe
            PC12_v2.1_Windows7_v3_portatil/OpenLadderTP02Capture.exe
            PC12_v2.1_Windows7_v3_portatil/OpenLadderTP02PgLab.exe
            PC12_v2.1_Windows7_v3_portatil/TP02-PG-Tests.json
            PC12_v2.1_Windows7_v3_portatil/version.txt

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: OpenLadder-Studio-Setup
          path: |
            installer/output/OpenLadder-Studio-Setup.exe
            installer/output/OpenLadder-Studio-Setup.exe.sha256

      - name: Publicar Release para atualização automática
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content 'PC12_v2.1_Windows7_v3_portatil\version.txt').Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'version.txt está vazio.' }
          $tag = "v$version"
          $setup = 'installer\output\OpenLadder-Studio-Setup.exe'
          $sha = 'installer\output\OpenLadder-Studio-Setup.exe.sha256'
          $title = "OpenLadder Studio v$version"

          $notes = "OpenLadder Studio v$version. Consulte CHANGELOG.md para os detalhes desta versão."
          if (Test-Path 'CHANGELOG.md') {
            $change = Get-Content 'CHANGELOG.md' -Raw
            $escaped = [Regex]::Escape($version)
            $match = [Regex]::Match($change, "(?ms)^## \[$escaped\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)")
            if ($match.Success -and -not [string]::IsNullOrWhiteSpace($match.Groups[1].Value)) {
              $notes = $match.Groups[1].Value.Trim()
            }
          }

          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [System.IO.File]::WriteAllText($notesFile, $notes, (New-Object System.Text.UTF8Encoding($false)))

          function Update-ExistingRelease {
            gh release upload $tag $setup $sha --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao enviar arquivos da release existente.' }
            gh release edit $tag --title $title --notes-file $notesFile --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao atualizar metadados da release existente.' }
          }

          cmd /c "gh release view $tag --repo $env:GITHUB_REPOSITORY >nul 2>&1"
          if ($LASTEXITCODE -eq 0) {
            Update-ExistingRelease
          }
          else {
            gh release create $tag $setup $sha --target $env:GITHUB_SHA --title $title --notes-file $notesFile --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) {
              Start-Sleep -Seconds 2
              cmd /c "gh release view $tag --repo $env:GITHUB_REPOSITORY >nul 2>&1"
              if ($LASTEXITCODE -eq 0) {
                Update-ExistingRelease
              }
              else {
                throw 'Não foi possível criar nem localizar a release.'
              }
            }
          }
