name: Validar PC12 Modern

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar fonte Ladder compatível
        shell: powershell
        working-directory: PC12_v2.1_Windows7_v3_portatil
        run: |
          (Get-Content 'LadderEditor.cs') -replace 'internal sealed class LadderCanvas : Control','internal sealed class LadderCanvas : ScrollableControl' | Set-Content 'LadderEditor.build.cs'

      - name: Compilar central PC12 Modern
        shell: cmd
        working-directory: PC12_v2.1_Windows7_v3_portatil
        run: |
          "%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /out:"PC12_Moderno.exe" /reference:System.dll /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "ModernPC12.cs"

      - name: Compilar PC12 Ladder Studio
        shell: cmd
        working-directory: PC12_v2.1_Windows7_v3_portatil
        run: |
          "%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /out:"PC12_Ladder.exe" /reference:System.dll /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "LadderEditor.build.cs"

      - name: Compilar TP02 Bridge Lab
        shell: cmd
        working-directory: PC12_v2.1_Windows7_v3_portatil
        run: |
          "%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /out:"TP02_Bridge_Lab.exe" /reference:System.dll /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "TP02BridgeLab.cs"

      - name: Compilar leitor RBP
        shell: cmd
        working-directory: PC12_v2.1_Windows7_v3_portatil
        run: |
          "%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /out:"TP02_RBP_Reader.exe" /reference:System.dll /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "TP02ProgramReader.cs"

      - name: Compilar decodificador RBP para IL
        shell: cmd
        working-directory: PC12_v2.1_Windows7_v3_portatil
        run: |
          "%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /out:"TP02_Machine_Decoder.exe" /reference:System.dll /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "TP02MachineDecoder.cs"

      - name: Compilar calibração automática de opcodes
        shell: cmd
        working-directory: PC12_v2.1_Windows7_v3_portatil
        run: |
          "%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /out:"TP02_Opcode_Calibration.exe" /reference:System.dll /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "TP02OpcodeCalibration.cs"

      - name: Compilar campanha guiada de calibração
        shell: cmd
        working-directory: PC12_v2.1_Windows7_v3_portatil
        run: |
          "%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /out:"TP02_Calibration_Campaign.exe" /reference:System.dll /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "TP02CalibrationCampaign.cs"

      - name: Compilar decodificador automático seguro
        shell: cmd
        working-directory: PC12_v2.1_Windows7_v3_portatil
        run: |
          "%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /main:ModernPC12.TP02AutoDecoderProgram /out:"TP02_Auto_Decoder.exe" /reference:System.dll /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "TP02MachineDecoder.cs" "TP02AutoDecoder.cs"

      - name: Compilar PC12 Studio unificado v0.7
        shell: cmd
        working-directory: PC12_v2.1_Windows7_v3_portatil
        run: |
          "%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /main:ModernPC12.UnifiedProgramV07 /out:"PC12_Studio.exe" /reference:System.dll /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "PC12Studio.cs" "PC12StudioV07.cs" "ModernPC12.cs" "LadderEditor.build.cs" "TP02BridgeLab.cs" "TP02ProgramReader.cs" "TP02MachineDecoder.cs" "TP02OpcodeCalibration.cs" "TP02CalibrationCampaign.cs" "TP02AutoDecoder.cs"

      - name: Publicar executaveis de teste
        uses: actions/upload-artifact@v4
        with:
          name: PC12-Studio-TP02
          path: |
            PC12_v2.1_Windows7_v3_portatil/PC12_Studio.exe
            PC12_v2.1_Windows7_v3_portatil/PC12_Moderno.exe
            PC12_v2.1_Windows7_v3_portatil/PC12_Ladder.exe
            PC12_v2.1_Windows7_v3_portatil/TP02_Bridge_Lab.exe
            PC12_v2.1_Windows7_v3_portatil/TP02_RBP_Reader.exe
            PC12_v2.1_Windows7_v3_portatil/TP02_Machine_Decoder.exe
            PC12_v2.1_Windows7_v3_portatil/TP02_Opcode_Calibration.exe
            PC12_v2.1_Windows7_v3_portatil/TP02_Calibration_Campaign.exe
            PC12_v2.1_Windows7_v3_portatil/TP02_Auto_Decoder.exe
