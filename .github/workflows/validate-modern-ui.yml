name: Validar OpenLadder Studio

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: openladder-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Mapear candidatos RUN STOP do PC12
        shell: cmd
        run: python scripts\analyze_pc12_runstop.py
