name: Analisar protocolo PC12 legado

on:
  push:
    branches:
      - analysis/pc12-protocol

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar análise PE
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pefile capstone

      - name: Localizar chamadas seriais e buffers
        shell: python
        run: |
          import pathlib, pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32
          from capstone.x86 import X86_OP_MEM, X86_OP_IMM

          path = pathlib.Path(r'PC12_v2.1_Windows7_v3_portatil/pc12.exe')
          data = path.read_bytes()
          pe = pefile.PE(str(path))
          image_base = pe.OPTIONAL_HEADER.ImageBase
          print('IMAGE_BASE', hex(image_base), 'ENTRY', hex(image_base + pe.OPTIONAL_HEADER.AddressOfEntryPoint))

          targets = {}
          for entry in getattr(pe, 'DIRECTORY_ENTRY_IMPORT', []):
              for imp in entry.imports:
                  if imp.name:
                      name = imp.name.decode('ascii', 'ignore')
                      if name in {'CreateFileA','ReadFile','WriteFile','SetCommState','GetCommState','SetupComm','SetCommMask','WaitCommEvent','PurgeComm','ClearCommError','CloseHandle'}:
                          targets[imp.address] = name
          print('IAT TARGETS')
          for va,name in sorted(targets.items()): print(name, hex(va))

          text = next(s for s in pe.sections if s.Name.rstrip(b'\0') == b'.text')
          code = text.get_data()
          base = image_base + text.VirtualAddress
          md = Cs(CS_ARCH_X86, CS_MODE_32)
          md.detail = True
          ins = list(md.disasm(code, base))
          by_addr = {x.address:i for i,x in enumerate(ins)}

          calls=[]
          for i,x in enumerate(ins):
              if x.mnemonic != 'call' or not x.operands: continue
              op=x.operands[0]
              resolved=None
              if op.type == X86_OP_MEM and op.mem.base == 0 and op.mem.index == 0:
                  resolved=op.mem.disp & 0xffffffff
              if resolved in targets:
                  calls.append((i, targets[resolved], resolved))

          print('\nSERIAL CALL SITES', len(calls))
          for n,(idx,name,iat) in enumerate(calls):
              print('\n===', n, name, 'CALL_AT', hex(ins[idx].address), 'IAT', hex(iat), '===')
              for y in ins[max(0,idx-35):min(len(ins),idx+16)]:
                  mark='>>' if y.address==ins[idx].address else '  '
                  print(mark, hex(y.address), y.mnemonic, y.op_str)

          print('\n=== STATIC STRING XREFS AROUND LINK/PG MESSAGES ===')
          markers=[b'TP02 Link Success !',b'Link Protocol fail',b'Not PG Protocol Function',b'PLC Mode: Running',b'PLC Mode: Program']
          for marker in markers:
              fo=data.find(marker)
              if fo<0: continue
              rva=pe.get_rva_from_offset(fo)
              va=image_base+rva
              print('\nMARKER', marker.decode(), 'FILE',hex(fo),'VA',hex(va))
              refs=[]
              for i,x in enumerate(ins):
                  for op in x.operands:
                      if op.type==X86_OP_IMM and (op.imm & 0xffffffff)==va:
                          refs.append(i)
                      elif op.type==X86_OP_MEM and op.mem.base==0 and op.mem.index==0 and (op.mem.disp & 0xffffffff)==va:
                          refs.append(i)
              print('XREFS', [hex(ins[i].address) for i in refs])
              for idx in refs[:8]:
                  print('--- context',hex(ins[idx].address),'---')
                  for y in ins[max(0,idx-25):min(len(ins),idx+25)]: print(hex(y.address),y.mnemonic,y.op_str)

      - name: Procurar tabelas PG e padrões de checksum
        shell: python
        run: |
          import pathlib, pefile, struct
          data=pathlib.Path(r'PC12_v2.1_Windows7_v3_portatil/pc12.exe').read_bytes()
          pe=pefile.PE(data=data)
          base=pe.OPTIONAL_HEADER.ImageBase
          for marker in [b'PGN',b'PG1',b'hPGM',b'HPGW',b'hpgO',b'pgL']:
              pos=0
              while True:
                  pos=data.find(marker,pos)
                  if pos<0: break
                  try: va=base+pe.get_rva_from_offset(pos)
                  except: va=0
                  print(marker.decode(errors='ignore'),'FILE',hex(pos),'VA',hex(va))
                  print(data[max(0,pos-64):min(len(data),pos+96)].hex(' '))
                  pos+=1
