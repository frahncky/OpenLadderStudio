name: Analisar protocolo PC12 legado

on:
  push:
    branches:
      - analysis/pc12-protocol

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Identificar binário PC12
        shell: pwsh
        run: |
          $p = 'PC12_v2.1_Windows7_v3_portatil/pc12.exe'
          Get-Item $p | Format-List Name,Length,FullName
          Get-FileHash $p -Algorithm SHA256

      - name: Extrair strings relevantes
        shell: python
        run: |
          import re, hashlib, pathlib
          p = pathlib.Path(r'PC12_v2.1_Windows7_v3_portatil/pc12.exe')
          data = p.read_bytes()
          print('SIZE', len(data))
          print('SHA256', hashlib.sha256(data).hexdigest())
          ascii_strings = [m.decode('latin1', 'ignore') for m in re.findall(rb'[\x20-\x7e]{3,}', data)]
          wide_raw = re.findall(rb'(?:[\x20-\x7e]\x00){3,}', data)
          wide_strings = [b[::2].decode('latin1', 'ignore') for b in wide_raw]
          keys = ['COM','LINK','UNLINK','SERIAL','PORT','BAUD','19200','RS422','RS-422','PLC','TP02','RUN','STOP','READ','WRITE','UPLOAD','DOWNLOAD','MONITOR','PASSWORD','TIMEOUT','MCR','MRV','RBP','SCS','WRV','WBP','PSR','STP','RTC','CLR','ROM','PG']
          def relevant(s):
              u=s.upper()
              return any(k in u for k in keys)
          print('\n=== ASCII RELEVANT STRINGS ===')
          for s in ascii_strings:
              if relevant(s): print(repr(s))
          print('\n=== UTF16 RELEVANT STRINGS ===')
          for s in wide_strings:
              if relevant(s): print(repr(s))
          print('\n=== EXACT 3-LETTER TOKENS AROUND KNOWN COMMANDS ===')
          for token in [b'MCR',b'MRV',b'RBP',b'SCS',b'WRV',b'WBP',b'PSR',b'STP',b'RUN',b'RTC',b'PAS',b'ROM',b'CLR']:
              positions=[m.start() for m in re.finditer(re.escape(token), data)]
              print(token.decode(), positions[:40], 'count=', len(positions))

      - name: Mostrar imports e chamadas seriais
        shell: pwsh
        run: |
          $p = Resolve-Path 'PC12_v2.1_Windows7_v3_portatil/pc12.exe'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -property installationPath
          $dump = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Hostx64\\x86\\dumpbin.exe$' } | Select-Object -First 1
          if (-not $dump) { $dump = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 }
          Write-Host "DUMPBIN=$($dump.FullName)"
          & $dump.FullName /imports $p | Select-String -Pattern 'CreateFile|ReadFile|WriteFile|SetComm|GetComm|EscapeComm|PurgeComm|ClearComm|WaitComm|SetupComm|CloseHandle' -Context 2,2
          & $dump.FullName /disasm $p > pc12.disasm.txt
          Write-Host '=== REFERENCES A SERIAL APIS NO DISASSEMBLY ==='
          Select-String -Path pc12.disasm.txt -Pattern 'WriteFile|ReadFile|SetCommState|CreateFileA|WaitCommEvent|PurgeComm|ClearCommError' -Context 20,20 | Select-Object -First 80

      - name: Procurar padrões de link PG no binário
        shell: python
        run: |
          import pathlib, re, struct
          data = pathlib.Path(r'PC12_v2.1_Windows7_v3_portatil/pc12.exe').read_bytes()
          markers = [b'TP02 Link Success !', b'Link Protocol fail', b'Not PG Protocol Function', b'COM1:Linking', b'PLC Mode: Running', b'PLC Mode: Program']
          for m in markers:
              pos = data.find(m)
              print('\nMARKER', m, 'FILE_OFFSET', pos)
              if pos >= 0:
                  lo=max(0,pos-128); hi=min(len(data),pos+256)
                  print(data[lo:hi].hex(' '))
          print('\n=== CANDIDATOS BINARIOS CURTOS REPETIDOS ===')
          # procura sequencias curtas perto de regiões de comunicação com muitos bytes de controle
          for start in range(0, len(data)-64, 16):
              chunk=data[start:start+32]
              controls=sum(1 for b in chunk if b < 0x20)
              printable=sum(1 for b in chunk if 0x20 <= b < 0x7f)
              if controls >= 12 and 4 <= printable <= 16 and any(x in chunk for x in (b'PG', b'COM', b'TP')):
                  print(start, chunk.hex(' '))
