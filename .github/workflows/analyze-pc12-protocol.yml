name: Analisar protocolo PC12 legado

on:
  push:
    branches:
      - analysis/pc12-protocol

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar análise PE
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pefile capstone

      - name: Isolar camada PG do Link
        shell: python
        run: |
          import pathlib, pefile, struct
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32

          p=pathlib.Path(r'PC12_v2.1_Windows7_v3_portatil/pc12.exe')
          data=p.read_bytes(); pe=pefile.PE(str(p)); ib=pe.OPTIONAL_HEADER.ImageBase
          text=next(s for s in pe.sections if s.Name.rstrip(b'\0')==b'.text')
          raw=text.get_data(); base=ib+text.VirtualAddress
          md=Cs(CS_ARCH_X86,CS_MODE_32); md.skipdata=True

          def off(va): return va-base
          def rel_dest(i):
              return (base+i+5+struct.unpack_from('<i',raw,i+1)[0]) & 0xffffffff
          def calls_in(a,b):
              out=[]
              for i in range(max(0,off(a)),min(len(raw)-5,off(b))):
                  if raw[i]==0xE8: out.append((base+i,rel_dest(i)))
              return out
          def callers(target,a=0x401000,b=0x4cd000):
              return [va for va,d in calls_in(a,b) if d==target]
          def dis(a,b):
              for x in md.disasm(raw[off(a):off(b)],a):
                  print(hex(x.address),x.mnemonic,x.op_str)
          def bytes_at(va,n): return raw[off(va):off(va)+n]

          print('=== CALLS FROM PC12 LINK STATE MACHINE TO SERIAL LAYER ===')
          link_start,link_end=0x4ad18d,0x4ae346
          for va,d in calls_in(link_start,link_end):
              if 0x46e000 <= d < 0x470000:
                  print(hex(va),'->',hex(d),'CALLERS_OF_DEST', [hex(x) for x in callers(d)[:30]])

          targets=[0x46efc0,0x46f018,0x46f300,0x46f570,0x46f5e6,0x46f76e,0x46f7f7,0x46f84c,0x46fa9e]
          print('\n=== SERIAL FUNCTIONS ===')
          for t in targets:
              print('\n--- FUNCTION',hex(t),'CALLERS', [hex(x) for x in callers(t)[:80]],'---')
              # Disassemble a bounded window; stop display after first RET past 20 bytes when possible.
              ins=list(md.disasm(raw[off(t):off(t)+0x500],t))
              for x in ins:
                  print(hex(x.address),x.mnemonic,x.op_str)
                  if x.mnemonic.startswith('ret') and x.address>t+0x20: break

          # Exact contexts for every link-state call into 46ef00-46fb20.
          print('\n=== LINK CALL CONTEXTS ===')
          for va,d in calls_in(link_start,link_end):
              if 0x46ef00 <= d < 0x46fb20:
                  print('\nCALL',hex(va),'TO',hex(d))
                  a=max(link_start,va-70); b=min(link_end,va+50)
                  dis(a,b)

          # Globals that look like PG frame/buffer state are referenced heavily near 4be4xx.
          globals_to_watch=[0x4fa7a8,0x4fa7a9,0x4fa7aa,0x4fa7ab,0x4fa7ac,0x4fa8ac,0x4fa8b7,0x4fa8b8,0x4fa8b9,0x530230,0x530233,0x560360,0x560364]
          print('\n=== WRITES TO PG GLOBALS INSIDE LINK ===')
          for g in globals_to_watch:
              needle=struct.pack('<I',g); pos=off(link_start); refs=[]
              while True:
                  q=raw.find(needle,pos,off(link_end))
                  if q<0: break
                  refs.append(base+q);pos=q+1
              if refs: print(hex(g),[hex(r) for r in refs])

          # Search for calls to the generic TX routine (46f5e6) and its immediate wrappers.
          print('\n=== CALL GRAPH TOWARD WRITEFILE TX ===')
          tx=0x46f5e6
          level1=callers(tx)
          print('TX',hex(tx),'L1', [hex(x) for x in level1])
          funcs=set()
          # For each callsite to TX, find nearest common prologue up to 0x300 back.
          for site in level1:
              p0=off(site); lo=max(0,p0-0x300); cand=[]
              q=lo
              while True:
                  q=raw.find(b'\x55\x8b\xec',q,p0)
                  if q<0: break
                  cand.append(base+q);q+=1
              if cand: funcs.add(cand[-1])
          for f in sorted(funcs):
              print('TX_WRAPPER',hex(f),'CALLED_AT',[hex(x) for x in callers(f)[:80]])

          # Dump data bytes at the known PG state buffer globals, if mapped into the image.
          print('\n=== INITIAL IMAGE DATA AROUND 4FA7A0 / 4FA8A0 ===')
          for va in [0x4fa780,0x4fa7a0,0x4fa8a0,0x530220,0x530230]:
              try:
                  fo=pe.get_offset_from_rva(va-ib)
                  print(hex(va),data[fo:fo+96].hex(' '))
              except Exception as e: print(hex(va),'ERR',e)
