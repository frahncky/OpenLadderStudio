name: Analisar protocolo PC12 legado

on:
  push:
    branches:
      - analysis/pc12-protocol

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair handshake PG e configuração serial
        shell: python
        run: |
          import pathlib, pefile, struct
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32

          p=pathlib.Path(r'PC12_v2.1_Windows7_v3_portatil/pc12.exe')
          data=p.read_bytes(); pe=pefile.PE(str(p)); ib=pe.OPTIONAL_HEADER.ImageBase
          text=next(s for s in pe.sections if s.Name.rstrip(b'\0')==b'.text')
          raw=text.get_data(); base=ib+text.VirtualAddress
          md=Cs(CS_ARCH_X86,CS_MODE_32); md.skipdata=True

          def image_bytes(va,n):
              rva=va-ib; fo=pe.get_offset_from_rva(rva); return data[fo:fo+n]
          def text_off(va): return va-base
          def dump_func(a,n=0x180):
              for x in md.disasm(raw[text_off(a):text_off(a)+n],a):
                  print(hex(x.address),x.mnemonic,x.op_str)
                  if x.mnemonic.startswith('ret') and x.address>a+0x10: break
          def ptr_refs(va):
              needle=struct.pack('<I',va); out=[]; pos=0
              while True:
                  q=raw.find(needle,pos)
                  if q<0: break
                  out.append(base+q); pos=q+1
              return out

          print('=== FIRST LINK CONSTANT ===')
          b=image_bytes(0x4dfb84,16)
          print('0x4dfb84 raw16 =',b.hex(' '))
          first7=b[:7]
          frame=first7+b'\x0d'
          print('first7 =',first7.hex(' '))
          print('first7 ASCII =',repr(first7.decode('latin1')))
          print('frame8 =',frame.hex(' '))
          print('sum first7 mod256 =',hex(sum(first7)&0xff))
          print('sum frame8 mod256 =',hex(sum(frame)&0xff))
          print('checksum-to-FF for first6 =',hex((0xff-(sum(first7[:6])&0xff))&0xff))
          print('refs 4dfb84 =',[hex(x) for x in ptr_refs(0x4dfb84)])
          print('refs 4dfb88 =',[hex(x) for x in ptr_refs(0x4dfb88)])

          print('\n=== KNOWN PG FRAMES ===')
          for fr in [bytes.fromhex('F0 00 0F'),bytes.fromhex('01 00 FE')]:
              print(fr.hex(' '),'sum=',hex(sum(fr)&0xff))

          print('\n=== LINK HANDSHAKE BUILDER 46F01D ===')
          dump_func(0x46f01d,0x80)

          print('\n=== HANDSHAKE BINARY COMMAND 46F300 ===')
          dump_func(0x46f300,0x120)

          print('\n=== SERIAL OPEN / DCB AREA AROUND LINK ===')
          # Show callsites to CreateFileA/GetCommState/SetCommState/SetupComm in 4ac000-4ae400.
          thunks={0x4cbe24:'CreateFileA',0x4cbe36:'GetCommState',0x4cbe72:'SetCommState',0x4cbe78:'SetupComm'}
          for i in range(max(0,text_off(0x4ac000)), min(len(raw)-5,text_off(0x4ae400))):
              if raw[i]!=0xE8: continue
              rel=struct.unpack_from('<i',raw,i+1)[0]; va=base+i; dest=(va+5+rel)&0xffffffff
              if dest in thunks:
                  print('\nCALL',thunks[dest],hex(va),'->',hex(dest))
                  lo=max(0,i-100); hi=min(len(raw),i+80)
                  for x in md.disasm(raw[lo:hi],base+lo):
                      if va-70 <= x.address <= va+50:
                          print(('>>' if x.address==va else '  '),hex(x.address),x.mnemonic,x.op_str)

          print('\n=== RESPONSE INSPECTION AFTER F0 00 0F IN LINK ===')
          for a,bnd in [(0x4adae0,0x4adc20),(0x4adc60,0x4add50)]:
              for x in md.disasm(raw[text_off(a):text_off(bnd)],a):
                  print(hex(x.address),x.mnemonic,x.op_str)
