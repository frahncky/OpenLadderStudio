name: Analyze PC12 protocol offline

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/analyze_pc12_protocol.py'
      - '.github/workflows/analyze-pc12-protocol.yml'
      - 'PC12_v2.1_Windows7_v3_portatil/pc12.exe'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run offline analyzer
        run: |
          mkdir -p protocol-analysis
          python3 scripts/analyze_pc12_protocol.py \
            PC12_v2.1_Windows7_v3_portatil/pc12.exe \
            -o protocol-analysis/pc12-protocol-analysis.txt

      - name: PE headers
        run: |
          {
            echo
            echo 'OBJDUMP PE HEADERS'
            echo '================================================================================'
            objdump -h PC12_v2.1_Windows7_v3_portatil/pc12.exe || true
          } >> protocol-analysis/pc12-protocol-analysis.txt

      - name: Relevant strings from GNU strings
        run: |
          {
            echo
            echo 'GNU STRINGS FILTER'
            echo '================================================================================'
            strings -tx -n 4 PC12_v2.1_Windows7_v3_portatil/pc12.exe \
              | grep -Ei 'Read PLC Program|PLC Program|Clear All Memory|Clear Program|Download|Upload|RUN|STOP|CON-ICB' \
              | head -n 300 || true
          } >> protocol-analysis/pc12-protocol-analysis.txt

      - name: Print report
        run: cat protocol-analysis/pc12-protocol-analysis.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: pc12-protocol-analysis
          path: protocol-analysis/pc12-protocol-analysis.txt
          retention-days: 30
