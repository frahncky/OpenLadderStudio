name: Analisar protocolo PC12 legado

on:
  push:
    branches:
      - analysis/pc12-protocol

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar análise PE
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pefile capstone

      - name: Encontrar chamadas seriais por bytes
        shell: python
        run: |
          import pathlib, pefile, struct
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32

          path = pathlib.Path(r'PC12_v2.1_Windows7_v3_portatil/pc12.exe')
          data = path.read_bytes()
          pe = pefile.PE(str(path))
          ib = pe.OPTIONAL_HEADER.ImageBase
          text = next(s for s in pe.sections if s.Name.rstrip(b'\0') == b'.text')
          raw = text.get_data()
          secva = ib + text.VirtualAddress

          imports = {}
          wanted = {'CreateFileA','ReadFile','WriteFile','SetCommState','GetCommState','SetupComm','SetCommMask','WaitCommEvent','PurgeComm','ClearCommError','CloseHandle'}
          for entry in getattr(pe,'DIRECTORY_ENTRY_IMPORT',[]):
              for imp in entry.imports:
                  if imp.name:
                      name = imp.name.decode('ascii','ignore')
                      if name in wanted: imports[imp.address] = name

          thunks = {}
          for i in range(len(raw)-6):
              if raw[i:i+2] != b'\xff\x25': continue
              ptr = struct.unpack_from('<I', raw, i+2)[0]
              if ptr in imports: thunks[secva+i] = imports[ptr]

          print('THUNKS', {hex(k):v for k,v in sorted(thunks.items())})

          sites=[]
          for i in range(len(raw)-5):
              if raw[i] != 0xE8: continue
              rel = struct.unpack_from('<i', raw, i+1)[0]
              callva = secva + i
              dest = (callva + 5 + rel) & 0xffffffff
              if dest in thunks:
                  sites.append((i, callva, dest, thunks[dest]))

          print('RAW REL32 SERIAL CALLS', len(sites))
          md = Cs(CS_ARCH_X86, CS_MODE_32)
          md.skipdata = True
          for n,(off,callva,dest,name) in enumerate(sites):
              print('\n=== CALL',n,name,'AT',hex(callva),'TO',hex(dest),'RAW',hex(text.PointerToRawData+off),'===')
              lo=max(0,off-180); hi=min(len(raw),off+120)
              print('BYTES', raw[lo:hi].hex(' '))
              for x in md.disasm(raw[lo:hi], secva+lo):
                  mark='>>' if x.address==callva else '  '
                  print(mark,hex(x.address),x.mnemonic,x.op_str)

          print('\n=== RAW POINTER XREFS TO SERIAL THUNKS ===')
          for thunk,name in sorted(thunks.items()):
              needle=struct.pack('<I',thunk)
              pos=0; hits=[]
              while True:
                  p=raw.find(needle,pos)
                  if p<0: break
                  hits.append(secva+p); pos=p+1
              print(name,hex(thunk),'PTR_REFS',[hex(x) for x in hits[:50]],'COUNT',len(hits))

          print('\n=== STRING POINTER XREFS ===')
          markers=[b'TP02 Link Success !',b'Link Protocol fail',b'PLC Mode: Running',b'PLC Mode: Program',b'Not PG Protocol Function']
          for marker in markers:
              search=0
              while True:
                  fo=data.find(marker,search)
                  if fo<0: break
                  va=ib+pe.get_rva_from_offset(fo)
                  needle=struct.pack('<I',va)
                  hits=[]; pos=0
                  while True:
                      p=raw.find(needle,pos)
                      if p<0: break
                      hits.append(p); pos=p+1
                  print('\nMARKER',marker.decode(),'VA',hex(va),'PTR_REFS',[hex(secva+p) for p in hits])
                  for p in hits[:10]:
                      lo=max(0,p-160); hi=min(len(raw),p+160)
                      for x in md.disasm(raw[lo:hi],secva+lo):
                          print(hex(x.address),x.mnemonic,x.op_str)
                  search=fo+1

      - name: Procurar chamadas indiretas e wrappers de WriteFile
        shell: python
        run: |
          import pathlib, pefile, struct
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32
          path=pathlib.Path(r'PC12_v2.1_Windows7_v3_portatil/pc12.exe')
          data=path.read_bytes(); pe=pefile.PE(str(path)); ib=pe.OPTIONAL_HEADER.ImageBase
          text=next(s for s in pe.sections if s.Name.rstrip(b'\0')==b'.text')
          raw=text.get_data(); secva=ib+text.VirtualAddress
          targets={'WriteFile':0x4cbea2,'ReadFile':0x4cbe60,'CreateFileA':0x4cbe24,'SetCommState':0x4cbe72}
          md=Cs(CS_ARCH_X86,CS_MODE_32); md.skipdata=True
          for name,target in targets.items():
              print('\nTARGET',name,hex(target))
              # Search any rel32 call/jmp whose decoded destination is target.
              for opcode,opname in [(0xE8,'CALL'),(0xE9,'JMP')]:
                  hits=[]
                  for i in range(len(raw)-5):
                      if raw[i]!=opcode: continue
                      rel=struct.unpack_from('<i',raw,i+1)[0]
                      va=secva+i
                      if ((va+5+rel)&0xffffffff)==target: hits.append(i)
                  print(opname,'HITS',[hex(secva+i) for i in hits])
              # Search literal pointer to thunk to catch mov reg, thunk / tables.
              needle=struct.pack('<I',target); pos=0; ptr=[]
              while True:
                  p=raw.find(needle,pos)
                  if p<0:break
                  ptr.append(p);pos=p+1
              print('LITERAL PTR HITS',[hex(secva+p) for p in ptr])
              for p in ptr[:20]:
                  lo=max(0,p-100);hi=min(len(raw),p+100)
                  print('CONTEXT PTR',hex(secva+p),raw[lo:hi].hex(' '))
