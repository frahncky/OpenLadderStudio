name: validate-tp02-compiler

on:
  pull_request:
    paths:
      - 'src/OpenLadderStudio.Core/Tp02TargetCompiler.cs'
      - 'src/OpenLadderStudio.Core/Tp02LadderTargetCompiler.cs'
      - 'tests/OpenLadderStudio.Core.Tests/Tp02TargetCompilerSelfTest.cs'
      - 'tests/OpenLadderStudio.Core.Tests/Tp02LadderTargetCompilerSelfTest.cs'
      - 'src/OpenLadderStudio.Desktop/Tp02DryRunPreview.cs'
      - 'src/OpenLadderStudio.Desktop/PrepareTp02DryRunV83.ps1'
      - 'src/OpenLadderStudio.Desktop/Build.bat'
      - 'docs/tp02-machine-code-reverse-engineering.md'
      - 'docs/tp02-opcode-research.md'
      - 'docs/data/tp02_function_map_normalized.csv'
      - '.github/workflows/validate-tp02-compiler.yml'
  push:
    branches:
      - main
    paths:
      - 'src/OpenLadderStudio.Core/Tp02TargetCompiler.cs'
      - 'src/OpenLadderStudio.Core/Tp02LadderTargetCompiler.cs'
      - 'tests/OpenLadderStudio.Core.Tests/Tp02TargetCompilerSelfTest.cs'
      - 'tests/OpenLadderStudio.Core.Tests/Tp02LadderTargetCompilerSelfTest.cs'
      - 'src/OpenLadderStudio.Desktop/Tp02DryRunPreview.cs'
      - 'src/OpenLadderStudio.Desktop/PrepareTp02DryRunV83.ps1'
      - '.github/workflows/validate-tp02-compiler.yml'

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar autoteste encoder TP02
        shell: cmd
        run: >-
          C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe
          /nologo
          /target:exe
          /out:Tp02TargetCompilerSelfTest.exe
          src\OpenLadderStudio.Core\Tp02TargetCompiler.cs
          tests\OpenLadderStudio.Core.Tests\Tp02TargetCompilerSelfTest.cs

      - name: Executar autoteste encoder TP02
        shell: cmd
        run: Tp02TargetCompilerSelfTest.exe

      - name: Compilar autoteste Ladder TP02
        shell: cmd
        run: >-
          C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe
          /nologo
          /target:exe
          /out:Tp02LadderTargetCompilerSelfTest.exe
          src\OpenLadderStudio.Core\LadderProject.cs
          src\OpenLadderStudio.Core\Tp02TargetCompiler.cs
          src\OpenLadderStudio.Core\Tp02LadderTargetCompiler.cs
          tests\OpenLadderStudio.Core.Tests\Tp02LadderTargetCompilerSelfTest.cs

      - name: Executar autoteste Ladder TP02
        shell: cmd
        run: Tp02LadderTargetCompilerSelfTest.exe
