name: Validate TP02 PG emulator

on:
  push:
    branches: [ main ]
    paths:
      - 'src/OpenLadderStudio.Desktop/TP02PgEmulator.cs'
      - 'src/OpenLadderStudio.Desktop/TP02PgReadback.cs'
      - 'src/OpenLadderStudio.Desktop/TP02PgReadbackSelfTest.cs'
      - 'src/OpenLadderStudio.Desktop/TP02PgEmulatorRules.txt'
      - 'src/OpenLadderStudio.Desktop/PrepareTp02EmulatorRules.ps1'
      - 'src/OpenLadderStudio.Desktop/BuildTp02Emulator.bat'
      - 'src/OpenLadderStudio.Desktop/AnalyzeTp02Capture.ps1'
      - 'src/OpenLadderStudio.Desktop/DiscoverTp02PgRunStop.ps1'
      - 'src/OpenLadderStudio.Desktop/DiscoverTp02PgRunStop.bat'
      - '.github/workflows/validate-tp02-emulator.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell tools
        shell: powershell
        run: |
          $files = @(
            'src/OpenLadderStudio.Desktop/AnalyzeTp02Capture.ps1',
            'src/OpenLadderStudio.Desktop/PrepareTp02EmulatorRules.ps1',
            'src/OpenLadderStudio.Desktop/DiscoverTp02PgRunStop.ps1'
          )
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$null,
              [ref]$errors
            ) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Build TP02 emulator
        shell: cmd
        working-directory: src/OpenLadderStudio.Desktop
        run: BuildTp02Emulator.bat

      - name: Build and run PG readback self-test
        shell: cmd
        working-directory: src/OpenLadderStudio.Desktop
        run: |
          "%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /target:exe /main:ModernPC12.TP02PgReadbackSelfTest /out:"TP02PgReadbackSelfTest.exe" /reference:System.dll "TP02PgEmulator.cs" "TP02PgReadback.cs" "TP02PgReadbackSelfTest.cs"
          if errorlevel 1 exit /b 1
          TP02PgReadbackSelfTest.exe
          if errorlevel 1 exit /b 1

      - name: Confirm executable
        shell: powershell
        run: |
          $exe = 'src/OpenLadderStudio.Desktop/OpenLadderTP02Emulator.exe'
          if (-not (Test-Path $exe)) { throw "Executavel nao foi gerado: $exe" }
          Write-Host "OK: $exe"

      - name: Package RUN STOP discovery bench
        uses: actions/upload-artifact@v4
        with:
          name: tp02-pg-run-stop-discovery
          path: |
            src/OpenLadderStudio.Desktop/OpenLadderTP02Emulator.exe
            src/OpenLadderStudio.Desktop/DiscoverTp02PgRunStop.ps1
            src/OpenLadderStudio.Desktop/DiscoverTp02PgRunStop.bat
            src/OpenLadderStudio.Desktop/BuildTp02Emulator.bat
            src/OpenLadderStudio.Desktop/TP02PgEmulator.cs
            src/OpenLadderStudio.Desktop/TP02PgReadback.cs
            src/OpenLadderStudio.Desktop/TP02PgEmulatorRules.txt
            src/OpenLadderStudio.Desktop/PrepareTp02EmulatorRules.ps1
          if-no-files-found: error
